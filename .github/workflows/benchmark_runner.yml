name: Penta-V Kernel Audit Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # يسمح لك بتشغيل الاختبار يدوياً في أي وقت

jobs:
  performance-audit:
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # تسريع التحميل في المرات القادمة

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # تثبيت المكتبات الإضافية لضمان عمل السكربتات
          pip install tabulate psutil numpy penta-v-kernel

      - name: 🛡️ Run Full Performance Audit
        run: |
          # تشغيل السكربت الرئيسي الذي يجمع كل الاختبارات
          python scripts/run_all_tests.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: 📊 Upload Audit Results
        if: always() # يرفع النتائج حتى لو فشل الاختبار
        uses: actions/upload-artifact@v4
        with:
          name: kernel-audit-report
          path: |
            benchmarks/results/
            *.log
