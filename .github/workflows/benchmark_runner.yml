name: Penta-V Kernel Audit Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  performance-audit:
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' 

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure all specific dependencies for Penta-V metrics are present
          pip install tabulate psutil numpy penta-v-kernel

      - name: 🛡️ Run Full Performance Audit
        run: |
          # Create results directory to avoid upload failure
          mkdir -p benchmarks/results
          # Execute main test suite and redirect output to a physical log file
          python scripts/run_all_tests.py | tee benchmarks/results/audit_report.log
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: 📊 Upload Audit Results
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: kernel-audit-report
          # Target the generated log file and directory
          path: |
            benchmarks/results/
            *.log
